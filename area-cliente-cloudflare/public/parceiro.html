<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Login do Parceiro | Premium</title>
    <link rel="icon" href="img/logo-premium.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        :root{--azul:#001735;--azul2:#08274d;--ouro:#e8b94a;--ouro2:#c99324;--texto:#10223d}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--texto);background:linear-gradient(120deg,rgba(0,23,53,.97),rgba(8,39,77,.78)),url('img/bg-hero.jpg') center/cover;font-family:'Montserrat',sans-serif}
        main{width:min(100%,920px);display:grid;grid-template-columns:.85fr 1.15fr;overflow:hidden;border:1px solid rgba(232,185,74,.65);border-radius:28px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.32)}
        .brand{position:relative;min-height:520px;padding:44px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(150deg,var(--azul),var(--azul2))}.brand::after{content:'';position:absolute;inset:17px;border:1px solid rgba(232,185,74,.35);border-radius:19px}.brand img{position:relative;z-index:1;width:105px;height:105px;border:2px solid rgba(232,185,74,.65);border-radius:50%;object-fit:cover}.brand-text{position:relative;z-index:1}.brand strong{display:block;color:var(--ouro);font-family:'Bodoni Moda',serif;font-size:3rem;line-height:1}.brand span{display:block;margin-top:10px;font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.13em;text-transform:uppercase}.brand p{margin:18px 0 0;color:rgba(255,255,255,.75);font-size:.84rem;line-height:1.6}
        .form{padding:clamp(34px,6vw,60px);align-self:center}.eyebrow{margin:0 0 10px;color:var(--ouro2);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{margin:0 0 12px;color:var(--azul);font-family:'Cinzel',serif;font-size:clamp(1.65rem,4vw,2.3rem)}.intro{margin:0 0 27px;color:#687589;font-size:.88rem;line-height:1.6}label{display:block;margin:16px 0 7px;color:var(--azul);font-size:.78rem;font-weight:700}input{width:100%;height:50px;border:2px solid #dce2e9;border-radius:12px;padding:0 15px;font:inherit;outline:none}input:focus{border-color:var(--ouro);box-shadow:0 0 0 4px rgba(232,185,74,.18)}button{width:100%;height:52px;margin-top:23px;border:0;border-radius:999px;color:var(--azul);background:var(--ouro);font:700 .86rem 'Montserrat';cursor:pointer;box-shadow:0 10px 25px rgba(201,147,36,.22)}button:disabled{opacity:.6}.message{min-height:22px;margin:14px 0 0;color:#a32626;font-size:.78rem;font-weight:600}.test{margin:20px 0 0;padding:12px 14px;border-left:4px solid var(--ouro);border-radius:8px;background:#f7f3e8;color:#59677a;font-size:.72rem;line-height:1.5}.back{display:inline-block;margin-top:16px;color:var(--azul);font-size:.74rem;font-weight:600;text-decoration:none}
        @media(max-width:700px){main{grid-template-columns:1fr}.brand{min-height:225px;padding:32px}.brand img{width:78px;height:78px}.brand p{display:none}.brand strong{font-size:2.25rem}}
    </style>
</head>
<body>
    <main>
        <section class="brand"><img src="img/logo-premium.jpg" alt="Premium"><div class="brand-text"><strong>Premium</strong><span>Assessoria Imobiliária</span><p>Informação e acompanhamento para fortalecer cada parceria.</p></div></section>
        <section class="form"><p class="eyebrow">Portal exclusivo</p><h1>Área do Parceiro</h1><p class="intro">Entre com o e-mail cadastrado pela Premium e seu código individual.</p>
            <form id="login"><label for="email">E-mail de acesso</label><input id="email" type="email" autocomplete="username" required placeholder="seuemail@exemplo.com"><label for="codigo">Código individual</label><input id="codigo" type="password" autocomplete="current-password" required maxlength="12" placeholder="••••••••"><div id="turnstile" style="margin-top:18px"></div><button id="button" type="submit">Entrar na área do parceiro</button></form>
            <p class="message" id="message" role="status"></p><p class="test">Se ainda não recebeu seu código individual, entre em contato com a equipe Premium.</p><a class="back" href="https://assessoriapremium.com.br/">← Voltar ao site</a>
        </section>
    </main>
    <script>
        const form=document.querySelector('#login'),button=document.querySelector('#button'),message=document.querySelector('#message');let turnstileWidget;
        async function config(){const response=await fetch('/api/config'),data=await response.json();if(data.turnstileSiteKey)turnstileWidget=turnstile.render('#turnstile',{sitekey:data.turnstileSiteKey})}
        form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='Validando acesso…';try{const token=turnstileWidget!==undefined?turnstile.getResponse(turnstileWidget):'';const response=await fetch('/api/parceiro/entrar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,codigo:document.querySelector('#codigo').value,turnstileToken:token})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Não foi possível entrar.');location.href='/parceiro/painel'}catch(error){message.textContent=error.message;button.disabled=false;if(turnstileWidget!==undefined)turnstile.reset(turnstileWidget)}});window.addEventListener('load',config);
    </script>
</body>
</html>
